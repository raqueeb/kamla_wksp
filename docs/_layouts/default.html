<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{% if page.title %}{{ page.title }} &bull; {% endif %}{{ site.title }}</title>
    {% if page.excerpt %}<meta name="description" content="{{ page.excerpt | strip_html }}">{% endif %}

    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <meta name="HandheldFriendly" content="True">
    <meta name="MobileOptimized" content="320">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="cleartype" content="on">

    <link rel="stylesheet" href="{{ '/css/main.css' | prepend: site.baseurl }}">
  </head>

  <body id="js-body">
    {% include header.html %}

    <nav role="navigation" id="js-menu" class="sliding-menu-content">
      <h5>{{ site.title }} <span></span></h5>
      <ul class="menu-item">
        <li><a href="{{ '/' | prepend: site.baseurl }}">হোম</a></li>
        <li><a href="{{ '/manual' | prepend: site.baseurl }}">গাইড</a></li>
        <li class="menu-gap"><a href="https://aiwithr.github.io/why/">কেন?</a></li>
        <li><a href="https://aiwithr.github.io/resources/">রিসোর্স</a></li>
        <li><a href="https://aiwithr.github.io/ds_roadmap/">রোডম্যাপ</a></li>
        <li><a href="https://aiwithr.github.io/about/">আমি কে?</a></li>
      </ul>
    </nav>
    <button type="button" id="js-menu-trigger" class="sliding-menu-button lines-button x2" role="button" aria-label="Toggle Navigation">
      <span class="nav-lines"></span>
    </button>
    <div id="js-menu-screen" class="menu-screen"></div>

    <div id="page-wrapper">
      <div id="main" role="main">
        <article class="wrap" itemscope itemtype="http://schema.org/Article">
          <div class="page-title">
            <h1>{{ page.title }}</h1>
          </div>
          <div class="inner-wrap">
            <div id="content" class="page-content" itemprop="articleBody">
              {{ content }}
            </div>
          </div>
        </article>
      </div>
      {% include footer.html %}
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
      var trigger = document.getElementById('js-menu-trigger');
      var menu = document.getElementById('js-menu');
      var screen = document.getElementById('js-menu-screen');
      if (trigger && menu && screen) {
        trigger.addEventListener('click', function(e) {
          menu.classList.toggle('is-visible');
          screen.classList.toggle('is-visible');
          trigger.classList.toggle('slide');
          trigger.classList.toggle('close');
          e.preventDefault();
        });
        screen.addEventListener('click', function(e) {
          menu.classList.toggle('is-visible');
          screen.classList.toggle('is-visible');
          trigger.classList.toggle('slide');
          trigger.classList.toggle('close');
          e.preventDefault();
        });
      }
    });
    </script>
  </body>
</html>
